<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#FFFFFF" />
  <!-- Two overlapping circles representing contacts/people -->
  <circle cx="200" cy="220" r="60" fill="#171717" />
  <circle cx="312" cy="220" r="60" fill="#171717" />
  <!-- Connecting line between contacts -->
